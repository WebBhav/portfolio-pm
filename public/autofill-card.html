<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoFill AI | AI Project Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* CSS Variables for Dark and Light Modes */
    :root {
      --bg: #121212;
      --card-bg: #303030;
      --card-border: #404040;
      --text-primary: #fafafa;
      --text-muted: #a3a3a3;
      --tag-bg: #212121;
      --tag-text: #e5e5e5;
      --accent: #00bcd4;
      --accent-hover: #26c6da;
      --btn-bg: #212121;
      --btn-border: #444444;
      --btn-hover: #2c2c2c;
      --btn-text: #fafafa;
      --shadow-base: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
      --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      --ring-focus: 0 0 0 3px rgba(0, 188, 212, 0.4);
    }

    [data-theme="light"] {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --text-primary: #171717;
      --text-muted: #6b7280;
      --tag-bg: #f3f4f6;
      --tag-text: #374151;
      --accent: #0097a7;
      --accent-hover: #00838f;
      --btn-bg: #0f172a;
      --btn-border: #0f172a;
      --btn-hover: #1e293b;
      --btn-text: #ffffff;
      --shadow-base: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.06);
      --ring-focus: 0 0 0 3px rgba(0, 151, 167, 0.35);
    }

    /* Universal Resets */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Theme Switcher Toggle */
    .controls {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      max-width: 580px;
      margin-bottom: 1.25rem;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      padding: 0.45rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .theme-toggle-btn:focus-visible {
      outline: none;
      box-shadow: var(--ring-focus);
    }

    /* Card Wrapper */
    .projects-container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Card Styles */
    .project-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-base);
      transition: box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s ease, border-color 0.3s ease;
    }

    .project-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    /* Card Image Banner */
    .card-media-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      background-color: #1a1a1a;
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .project-card:hover .card-image {
      transform: scale(1.04);
    }

    /* Card Header */
    .card-header {
      padding: 1.25rem 1.25rem 0.625rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    .title-icon {
      color: var(--accent);
      width: 1.375rem;
      height: 1.375rem;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text-primary);
    }

    .card-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      font-weight: 500;
    }

    /* Tag Chips */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      list-style: none;
    }

    .tag-chip {
      background-color: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.175rem 0.65rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    [data-theme="light"] .tag-chip {
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    /* Card Body */
    .card-body {
      padding: 0.5rem 1.25rem 0.75rem 1.25rem;
      flex-grow: 1;
    }

    /* Description with Smooth Collapse Transition */
    .description-container {
      position: relative;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .description-container.collapsed {
      max-height: 4.85em; /* Approximately 3 lines */
    }

    .description-container.expanded {
      max-height: 1000px; /* Safe upper limit for transition */
    }

    .description-text {
      font-size: 0.875rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin: 0;
    }

    .description-container.collapsed .description-text {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Read More / Read Less Toggle */
    .toggle-read-btn {
      background: none;
      border: none;
      padding: 0.35rem 0;
      color: var(--accent);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      margin-top: 0.25rem;
      transition: color 0.2s ease;
    }

    .toggle-read-btn:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .toggle-read-btn:focus-visible {
      outline: none;
      box-shadow: var(--ring-focus);
      border-radius: 0.25rem;
    }

    /* Card Footer / Action Button */
    .card-footer {
      padding: 0.75rem 1.25rem 1.25rem 1.25rem;
    }

    .view-project-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.65rem 1rem;
      background-color: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 0.5rem;
      color: var(--btn-text);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      gap: 0.5rem;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .view-project-btn:hover {
      background-color: var(--btn-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .view-project-btn:focus-visible {
      outline: none;
      box-shadow: var(--ring-focus);
    }

    .view-project-btn svg {
      width: 1rem;
      height: 1rem;
      flex-shrink: 0;
    }

    /* Responsive Adjustments */
    @media (max-width: 480px) {
      .card-media-wrapper {
        height: 180px;
      }
      .card-header {
        padding: 1rem 1rem 0.5rem 1rem;
      }
      .card-body {
        padding: 0.5rem 1rem 0.75rem 1rem;
      }
      .card-footer {
        padding: 0.5rem 1rem 1rem 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Controls: Theme switcher for previewing light & dark -->
  <div class="controls">
    <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle theme">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <span id="themeLabel">Light Mode</span>
    </button>
  </div>

  <!-- Main Projects Showcase Container -->
  <main class="projects-container" id="projectsContainer">
    <!-- Card is dynamically rendered here -->
  </main>

  <script>
    /**
     * Project Data Configuration
     * Add more objects to this array to render additional project cards.
     */
    const PROJECT_CONFIG = [
      {
        id: "autofill-ai",
        title: "AutoFill AI | AI",
        date: "October 2026",
        tags: ["AI", "Chrome Extension", "Automation", "LLM", "Manifest V3"],
        description: "Developed an AI-powered Chrome extension that automatically fills web forms and job applications using a personal profile built from the user's resume. The system reads an uploaded PDF with an LLM (Gemini, OpenAI, Anthropic or any OpenAI-compatible provider, using the user's own API key) and generates a structured, editable profile. When a form is opened, it detects each field, understands what is being asked from its label and surrounding context, and fills in the right answer. It handles text inputs, native and custom dropdowns, radio buttons, checkboxes and dates. It also clicks \"+ Add\" buttons to create extra rows for websites, experience and education, and attaches the stored resume to upload fields. Designed with safety and privacy in mind: it never auto-submits a form, never touches password or payment fields, leaves unknown fields blank instead of guessing, and keeps all data stored locally in the browser. Built on Manifest V3 with a review panel, confidence highlighting, undo, and a learning cache that remembers user corrections.",
        imageUrl: "/AutoFill.jpg",
        projectUrl: "https://autofill-ai.netlify.app/", // Configure project link here
        buttonText: "View Project",
        startExpanded: false
      }
    ];

    /**
     * Render the project cards into the DOM
     */
    function renderProjectCards(projects, containerElement) {
      containerElement.innerHTML = projects.map((project, index) => `
        <article class="project-card" id="card-${project.id}">
          <!-- Media Showcase Banner -->
          <div class="card-media-wrapper">
            <img 
              src="${project.imageUrl}" 
              alt="${project.title} Banner" 
              class="card-image"
              loading="lazy"
            />
          </div>

          <!-- Header: Title, Icon, Date, Tag Chips -->
          <header class="card-header">
            <div class="card-title-row">
              <div class="card-title-group">
                <!-- Sparkles / AI Icon -->
                <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                  <path d="M5 3v4"/>
                  <path d="M19 17v4"/>
                  <path d="M3 5h4"/>
                  <path d="M17 19h4"/>
                </svg>
                <h2 class="card-title">${project.title}</h2>
              </div>
              <span class="card-date">${project.date}</span>
            </div>

            <!-- Tags -->
            <ul class="tag-list" aria-label="Project tags">
              ${project.tags.map(tag => `<li class="tag-chip">${tag}</li>`).join('')}
            </ul>
          </header>

          <!-- Body: Collapsible Description -->
          <div class="card-body">
            <div 
              class="description-container ${project.startExpanded ? 'expanded' : 'collapsed'}" 
              id="desc-${project.id}"
            >
              <p class="description-text">${project.description}</p>
            </div>
            <button 
              type="button" 
              class="toggle-read-btn" 
              id="btn-toggle-${project.id}"
              aria-expanded="${project.startExpanded ? 'true' : 'false'}"
              aria-controls="desc-${project.id}"
              onclick="handleToggleDescription('${project.id}')"
            >
              ${project.startExpanded ? 'Read less' : 'Read more'}
            </button>
          </div>

          <!-- Footer: Action Button -->
          <footer class="card-footer">
            <a 
              href="${project.projectUrl}" 
              target="_blank" 
              rel="noopener noreferrer" 
              class="view-project-btn"
            >
              <span>${project.buttonText}</span>
              <!-- External Link Icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </a>
          </footer>
        </article>
      `).join('');
    }

    /**
     * Description Toggle Logic
     * Toggles between expanded full text and collapsed ~3 line clamp with an ellipsis.
     * Updates aria-expanded attribute for accessibility.
     */
    function handleToggleDescription(projectId) {
      const container = document.getElementById(`desc-${projectId}`);
      const btn = document.getElementById(`btn-toggle-${projectId}`);
      if (!container || !btn) return;

      const isExpanded = container.classList.contains('expanded');

      if (isExpanded) {
        // Collapse the description
        container.classList.remove('expanded');
        container.classList.add('collapsed');
        btn.textContent = 'Read more';
        btn.setAttribute('aria-expanded', 'false');
      } else {
        // Expand the description
        container.classList.remove('collapsed');
        container.classList.add('expanded');
        btn.textContent = 'Read less';
        btn.setAttribute('aria-expanded', 'true');
      }
    }

    /**
     * Theme Toggle Handler (Light / Dark mode preview)
     */
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');
    let isDark = true;

    themeToggleBtn.addEventListener('click', () => {
      isDark = !isDark;
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        themeLabel.textContent = 'Light Mode';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeLabel.textContent = 'Dark Mode';
      }
    });

    // Initialize the card
    const container = document.getElementById('projectsContainer');
    renderProjectCards(PROJECT_CONFIG, container);
  </script>
</body>
</html>
